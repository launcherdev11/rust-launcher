[package]
name = "mc16launcher"
version = "3.3.2"
description = "An optimized Minecraft launcher for creating modpacks, downloading mods directly, and launching the game with custom settings."
authors = ["16steyy"]
edition = "2021"


[lib]
name = "mc16launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
futures-util = "0.3"
dirs = "5"
zip = "2"
toml = "0.9"
ignore = "0.4"
rand = "0.8"
urlencoding = "2"
sha1 = "0.10"
sha2 = "0.10"
once_cell = "1"
dotenvy = "0.15.7"
sysinfo = "0.38.2"
base64 = "0.22"
discord-rich-presence = "1.1.0"
image = "0.25"
url = "2"
open = "5"
aes-gcm = "0.10"

[target.'cfg(windows)'.dependencies]
tauri-plugin-http = { version = "2", features = ["native-tls"] }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-http = { version = "2", features = ["rustls-tls"] }


[profile.release]
lto = true
codegen-units = 1
strip = true
